name: Deploy to Vercel (manual)

# Vercel's Git integration auto-deploys every push to main (see
# ARCHITECTURE.md § Deployment Pipeline). This workflow is kept only as a
# manual fallback and must NOT run on push, otherwise every commit triggers
# two deploys of the same commit.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy
        run: curl -s -X POST "https://api.vercel.com/v1/integrations/deploy/prj_pQghRxiSRDuC6n1iTYxb5szn5ClA/4aBnUEXhUJ"
